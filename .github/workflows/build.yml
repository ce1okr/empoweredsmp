name: Build EmpowerSMP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build with Maven
        run: mvn -B -f EmpoweredSMP/pom.xml clean package
      - name: Upload built plugin
        uses: actions/upload-artifact@v4
        with:
          name: EmpowerSMP-jar
          path: EmpoweredSMP/target/EmpowerSMP.jar
